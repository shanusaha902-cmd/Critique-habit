
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Critique Pro Max</title>
    
    <link id="manifest-link" rel="manifest" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* DARK INDIGO THEME + NEON LIME ACCENT */
        :root { 
            --bg: #0F111A; 
            --card: #181B26; 
            --accent: #D4FF00; 
            --accent-dark: #A3C900;
            --text: #F5F5F7; 
            --gray: #8B949E; 
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; overflow-x: hidden; padding-bottom: 110px; }
        
        @media (min-width: 768px) {
            body { display: flex; justify-content: center; background: #000; }
            #app-container { width: 100%; max-w: 480px; background: var(--bg); min-height: 100vh; border-left: 1px solid #232838; border-right: 1px solid #232838; position: relative; }
            .floating-nav { max-w: 440px; left: 50% !important; transform: translateX(-50%) !important; }
            .fab-btn { right: calc(50% - 200px) !important; bottom: 110px !important; }
        }

        .glass-card { background: var(--card); border: 1px solid rgba(255,255,255,0.03); }
        
        /* Floating Pill Navigation */
        .floating-nav { 
            background: #13151F; border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 40px; bottom: 15px; left: 5%; width: 90%; height: 75px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.9); z-index: 50;
        }
        .nav-icon-bg { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .nav-btn.active .nav-icon-bg { background: var(--accent); color: #0F111A; box-shadow: 0 0 15px rgba(212,255,0,0.3); }
        .nav-btn:not(.active) .nav-icon-bg { background: transparent; color: #6B7280; }
        
        .progress-ring__circle { transition: stroke-dashoffset 0.5s ease-in-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
        
        /* Interactive Checkbox */
        .habit-checkbox { appearance: none; width: 26px; height: 26px; border: 2px solid #2D3345; border-radius: 50%; background: transparent; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .habit-checkbox:checked { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px rgba(212, 255, 0, 0.4); transform: scale(1.1); }
        .habit-checkbox:checked::after { content: '✓'; position: absolute; color: #0F111A; font-size: 14px; font-weight: 900; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* Streak Pills */
        .streak-pill { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--gray); background: var(--card); border: 1px solid #232838; cursor: pointer; transition: all 0.2s; }
        .streak-pill.active { background: var(--accent-dark); color: #0F111A; border-color: var(--accent-dark); }
        .streak-pill.selected { border: 2px solid var(--accent); color: var(--text); }

        /* Progress Centerpiece 3D Animation */
        @keyframes majesticFloat3D {
            0% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8)); }
            50% { transform: translateY(-15px) rotateX(-5deg) rotateY(10deg); filter: drop-shadow(0 35px 35px rgba(212,255,0,0.2)); }
            100% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8)); }
        }
        .badge-centerpiece { animation: majesticFloat3D 4s ease-in-out infinite; transform-style: preserve-3d; perspective: 1000px; display: flex; justify-content: center; margin-bottom: 1.5rem; margin-top: 1rem;}

        /* Star Animation */
        @keyframes starPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .star-lit { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); animation: starPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .star-dim { color: #2D3345; }

        /* --- THE ROYAL BANNER LEVEL UP SEQUENCE --- */
        .mask-banner { clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 92%, 0 100%); }
        
        @keyframes bannerDrop { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .banner-drop-active { animation: bannerDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes badgeReveal { 0% { transform: scale(0.5) translateY(50px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .badge-reveal-active { opacity: 0; animation: badgeReveal 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards; }
        
        @keyframes lightSweep { 0% { left: -100%; } 100% { left: 200%; } }
        .banner-light-sweep { position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transform: skewX(-20deg); animation: lightSweep 2s ease-in-out infinite; pointer-events: none; }

        @keyframes floatParticle { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 20% { opacity: 1; transform: translateY(80vh) scale(1); } 100% { transform: translateY(-10vh) scale(0.5); opacity: 0; } }
        .lu-particle { position: absolute; background: #FEF08A; border-radius: 50%; box-shadow: 0 0 10px #EAB308; opacity: 0; animation: floatParticle 3s linear infinite; }

        .tab-content { display: none; animation: fadeIn 0.3s ease-out forwards; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .timeline-line { position: absolute; left: 39px; top: 10px; bottom: 10px; width: 2px; background: #232838; z-index: 0; }
    </style>
</head>
<body class="antialiased">

    <div id="app-container" class="mx-auto relative min-h-screen">
        
        <!-- ==================== TAB 1: HOME ==================== -->
        <main id="tab-home" class="tab-content active px-5 pt-8">
            <header class="mb-6 flex justify-between items-start">
                <div>
                    <h1 class="text-4xl font-black tracking-tight" id="header-title">Today's Plan</h1>
                    <p id="current-date-text" class="text-sm font-semibold text-[var(--accent)] mt-1 cursor-pointer hover:underline" onclick="Navigation.switchTab('calendar')">Select Date</p>
                </div>
                <button onclick="App.requestNotifications()" class="w-10 h-10 rounded-full flex items-center justify-center text-[var(--accent)] bg-[var(--card)] border border-white/5 transition-colors"><i class="ph-fill ph-bell text-xl"></i></button>
            </header>

            <div class="glass-card rounded-[32px] p-6 mb-8">
                <div class="flex items-center gap-6 mb-6">

                        <div id="home-ring-text" class="absolute inset-0 flex items-center justify-center font-black text-lg">0%</div>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black mb-1 text-white" id="dash-xp">0 XP</h2>
                        <div class="bg-[#232838] px-3 py-1 rounded-lg text-xs font-bold text-gray-300 inline-block" id="task-ratio">0/0 Missions</div>
                    </div>
                </div>
                <div class="flex justify-between items-center" id="streak-row"></div>
            </div>

            <div class="mb-6">
                <h3 class="text-[11px] font-bold text-[#FFD700] uppercase tracking-widest mb-3 flex items-center gap-2"><i class="ph-fill ph-star"></i> Top Priorities</h3>
                <div id="priority-list" class="space-y-3"></div>
            </div>

            <div id="habit-list-container" class="space-y-6"></div>
        </main>

        <!-- ==================== TAB 2: SCHEDULE ==================== -->
        <main id="tab-calendar" class="tab-content px-5 pt-8">
            <h1 class="text-3xl font-black tracking-tight mb-6">Schedule</h1>
            
            <div class="glass-card rounded-[32px] p-5 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="CalendarUI.changeMonth(-1)" class="p-2 rounded-full bg-[#232838] text-white"><i class="ph-bold ph-caret-left"></i></button>
                    <h2 id="cal-month-year" class="font-bold text-base">Month Year</h2>
                    <button onclick="CalendarUI.changeMonth(1)" class="p-2 rounded-full bg-[#232838] text-white"><i class="ph-bold ph-caret-right"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-500 mb-2">
                    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                </div>
                <div id="cal-grid" class="grid grid-cols-7 gap-2"></div>
            </div>

            <div class="flex justify-between items-end mb-6">
                <h2 id="schedule-date-title" class="text-xl font-bold text-white">Timeline</h2>
                <button onclick="App.viewDate(App.getTodayReal())" class="text-xs font-bold bg-[var(--accent)] text-[#0F111A] px-4 py-2 rounded-full shadow-lg">Jump to Today</button>
            </div>
            
            <div class="relative min-h-[200px]" id="schedule-timeline">
                <div class="timeline-line"></div>
            </div>
        </main>

        <!-- ==================== TAB 3: PROGRESS ==================== -->
        <main id="tab-progress" class="tab-content px-5 pt-8">
            
            <div class="text-center mb-10 pt-2">
                <p class="text-xs font-bold text-gray-400 tracking-widest uppercase mb-1">Current Designation</p>
                <div id="prog-badge-main" class="badge-centerpiece"></div>
                <h2 id="prog-rank" class="text-4xl font-black text-white mb-3">Rank</h2>
                
                <div id="prog-stars" class="flex justify-center gap-3 mb-4 text-2xl"></div>
                
                <p class="text-sm font-bold text-gray-400"><span id="prog-xp" class="text-[var(--accent)]">0</span> / <span id="prog-next">1000</span> XP to next tier</p>
                <div class="w-64 h-3 bg-[#181B26] rounded-full mx-auto mt-4 overflow-hidden border border-white/5"><div id="prog-bar" class="h-full bg-[var(--accent)] w-0 transition-all duration-1000 shadow-[0_0_15px_var(--accent)]"></div></div>
            </div>

            <h3 class="text-xl font-black mb-6 border-b border-[#232838] pb-2">Levels of Membership</h3>
            <div id="ladder-container" class="pb-10 space-y-5"></div>
        </main>

        <!-- ==================== TAB 4: PROFILE ==================== -->
        <main id="tab-profile" class="tab-content px-5 pt-8">
            <h1 class="text-3xl font-black tracking-tight mb-8">Commander Profile</h1>
            
            <div class="glass-card rounded-[32px] p-6 mb-8 border-t border-[var(--accent)]/20">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">XP Trajectory (7 Days)</h3>
                <canvas id="xpChart" height="150"></canvas>
            </div>

            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-black text-white">Strategic Goals</h2>
                    <button onclick="UI.addGoal()" class="text-[#0F111A] bg-[var(--accent)] text-xs font-bold px-4 py-2 rounded-full shadow-md">+ Add Goal</button>
                </div>
                <div id="goals-container" class="space-y-4"></div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-10">
                <button onclick="App.exportData()" class="py-4 rounded-2xl bg-[#232838] text-white font-bold text-sm hover:bg-[#2D3345]">Backup Data</button>
                <button onclick="App.resetData()" class="py-4 rounded-2xl bg-[#FF3B30]/10 text-[#FF3B30] font-bold border border-[#FF3B30]/30 text-sm">Wipe System</button>
            </div>
        </main>

    </div>

    <!-- FLOATING ADD BUTTON -->
    <button onclick="UI.openModal()" class="fixed bottom-[110px] right-6 w-16 h-16 bg-[var(--accent)] text-[#0F111A] rounded-full flex items-center justify-center text-4xl shadow-[0_10px_25px_rgba(212,255,0,0.4)] hover:scale-105 transition-transform z-40 fab-btn">
        <i class="ph-bold ph-plus"></i>
    </button>

    <!-- FLOATING PILL NAVIGATION (4 TABS) -->
    <nav class="fixed floating-nav flex justify-around items-center px-1 z-50">
        <button onclick="Navigation.switchTab('home')" class="nav-btn active flex items-center justify-center w-[25%] h-full" data-target="home">
            <div class="nav-icon-bg"><i class="ph-fill ph-house text-2xl"></i></div>
        </button>
        <button onclick="Navigation.switchTab('calendar')" class="nav-btn flex items-center justify-center w-[25%] h-full" data-target="calendar">
            <div class="nav-icon-bg"><i class="ph-bold ph-calendar-blank text-2xl"></i></div>
        </button>
        <button onclick="Navigation.switchTab('progress')" class="nav-btn flex items-center justify-center w-[25%] h-full" data-target="progress">
            <div class="nav-icon-bg"><i class="ph-bold ph-shield-chevron text-2xl"></i></div>
        </button>
        <button onclick="Navigation.switchTab('profile')" class="nav-btn flex items-center justify-center w-[25%] h-full" data-target="profile">
            <div class="nav-icon-bg"><i class="ph-bold ph-user-circle text-2xl"></i></div>
        </button>
    </nav>

    <!-- ADD/EDIT MODAL -->
    <div id="modal-backdrop" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity flex items-end sm:items-center justify-center">
        <div id="habit-modal" class="bg-[var(--card)] w-full max-w-md sm:rounded-[32px] rounded-t-[32px] border border-white/5 p-8 pb-12 transform translate-y-full transition-transform">
            <div class="flex justify-between items-center mb-8">
                <h2 id="modal-title" class="text-2xl font-black text-white">Configure Target</h2>
                <button onclick="UI.closeModal()" class="w-10 h-10 bg-[#232838] rounded-full text-gray-400 hover:text-white flex items-center justify-center"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <input type="hidden" id="item-id">
            <div class="space-y-5">
                <input type="text" id="item-text" placeholder="Mission Title" class="w-full bg-[#0F111A] border border-[#232838] rounded-2xl px-5 py-4 text-white focus:border-[var(--accent)] focus:outline-none font-bold">
                
                <div class="grid grid-cols-2 gap-4">
                    <select id="item-type" onchange="UI.toggleDateInput()" class="w-full bg-[#0F111A] border border-[#232838] rounded-2xl px-5 py-4 text-white font-bold focus:outline-none">
                        <option value="habit">Daily Habit</option>
                        <option value="task">Scheduled Task</option>
                        <option value="priority">Top Priority</option>
                    </select>
                    <input type="date" id="item-date" class="w-full bg-[#0F111A] border border-[#232838] rounded-2xl px-5 py-4 text-white font-bold opacity-50 focus:outline-none" disabled>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="item-xp" placeholder="XP (e.g. 50)" class="w-full bg-[#0F111A] border border-[#232838] rounded-2xl px-5 py-4 text-[var(--accent)] font-black focus:outline-none focus:border-[var(--accent)]">
                    <input type="time" id="item-time" class="w-full bg-[#0F111A] border border-[#232838] rounded-2xl px-5 py-4 text-white font-bold focus:outline-none focus:border-[var(--accent)]">
                </div>

                <div>
                    <input type="text" id="item-category" list="cat-list" placeholder="Category (e.g. Morning)" class="w-full bg-[#0F111A] border border-[#232838] rounded-2xl px-5 py-4 text-white font-bold focus:outline-none focus:border-[var(--accent)]">
                    <datalist id="cat-list"></datalist>
                </div>
                
                <button onclick="App.saveItem()" class="w-full py-5 bg-[var(--accent)] text-[#0F111A] font-black text-xl rounded-full shadow-[0_5px_20px_rgba(212,255,0,0.3)] mt-4">LOCK IT IN</button>
                <button id="btn-delete" onclick="App.deleteItem()" class="hidden w-full py-4 rounded-full text-[#FF3B30] bg-[#FF3B30]/10 font-bold border border-[#FF3B30]/30 mt-2">Delete Mission</button>
            </div>
        </div>
    </div>

    <!-- REGAL BANNER LEVEL UP OVERLAY -->
    <div id="level-up-screen" class="fixed inset-0 z-[200] hidden items-center justify-center overflow-hidden bg-black/90 backdrop-blur-md transition-all duration-500">
        <!-- Golden ambient glow -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(212,255,0,0.1)_0%,transparent_60%)] pointer-events-none"></div>

        <!-- The Majestic Dropping Banner -->
        <div id="lu-banner" class="absolute top-0 w-72 h-[65vh] bg-gradient-to-b from-[#EAB308] via-[#CA8A04] to-transparent shadow-[0_0_50px_rgba(234,179,8,0.3)] flex flex-col items-center pt-24 mask-banner pointer-events-none">
            <div class="banner-light-sweep"></div>
        </div>
        
        <!-- Golden Particles -->
        <div class="lu-particle w-2 h-2" style="left: 20%; animation-delay: 0s;"></div>
        <div class="lu-particle w-3 h-3" style="left: 40%; animation-delay: 1s;"></div>
        <div class="lu-particle w-2 h-2" style="left: 60%; animation-delay: 0.5s;"></div>
        <div class="lu-particle w-4 h-4" style="left: 80%; animation-delay: 1.5s;"></div>

        <div id="level-up-content" class="relative z-10 flex flex-col items-center w-full">
            <div id="new-rank-icon" class="mb-6 drop-shadow-[0_0_30px_rgba(255,255,255,0.5)]"></div>
            
            <h1 class="text-[var(--accent)] font-black text-5xl mb-2 tracking-widest uppercase drop-shadow-[0_0_10px_rgba(212,255,0,0.5)]">PROMOTED</h1>
            
            <h3 id="new-rank-name" class="text-4xl font-black text-white mb-4 drop-shadow-md">Master I</h3>
            
            <div id="new-rank-stars" class="flex justify-center gap-3 mb-10 text-4xl"></div>
            
            <button onclick="UI.hideLevelUp()" class="w-full max-w-[250px] py-4 bg-gradient-to-r from-[#FACC15] to-[#EAB308] text-[#0F111A] font-black text-xl rounded-full shadow-[0_0_25px_rgba(234,179,8,0.5)] hover:scale-105 transition-transform border border-[#FEF08A]">CONTINUE</button>
        </div>
    </div>

    <script>
        // --- OFFLINE PWA ENGINE (GENERATES ICON & SERVICE WORKER) ---
        const PWAEngine = {
            init: () => {
                // Generate Base64 High-Res Logo for Home Screen
                const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0F111A" rx="115"/><path d="M256 80 L420 160 L380 380 L256 460 L132 380 L92 160 Z" fill="#181B26" stroke="#D4FF00" stroke-width="24"/><polygon points="256,140 330,240 256,380 180,240" fill="#D4FF00"/><polygon points="256,140 256,380 180,240" fill="#A3C900"/></svg>`;
                const base64Icon = "data:image/svg+xml;base64," + btoa(svgIcon);

                const manifest = {
                    name: "Critique Pro Max", short_name: "Critique", start_url: window.location.pathname,
                    display: "standalone", background_color: "#0F111A", theme_color: "#D4FF00",
                    icons: [{ src: base64Icon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
                };
                
                document.getElementById('manifest-link').setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));

                // Install the Offline Service Worker
                const swCode = `
                    const CACHE = 'critique-v15';
                    self.addEventListener('install', e => { self.skipWaiting(); e.waitUntil(caches.open(CACHE).then(c => c.addAll([location.pathname]))); });
                    self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
                    self.addEventListener('fetch', e => {
                        e.respondWith(
                            caches.match(e.request).then(res => res || fetch(e.request).then(fRes => {
                                return caches.open(CACHE).then(c => { if(e.request.url.startsWith('http')) c.put(e.request, fRes.clone()); return fRes; });
                            })).catch(() => caches.match(location.pathname))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
            }
        };

        // --- AUDIO ENGINE ---
        const AudioSys = {
            ctx: null,
            init: () => { if (!AudioSys.ctx) AudioSys.ctx = new (window.AudioContext || window.webkitAudioContext)(); if(AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume(); },
            playConquerDing: () => {
                AudioSys.init(); const now = AudioSys.ctx.currentTime;
                const osc1 = AudioSys.ctx.createOscillator(); const gain1 = AudioSys.ctx.createGain();
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(150, now); osc1.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain1.gain.setValueAtTime(0.7, now); gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc1.connect(gain1).connect(AudioSys.ctx.destination); osc1.start(); osc1.stop(now + 0.3);
                
                [523.25, 659.25, 783.99].forEach((freq, i) => { 
                    setTimeout(() => {
                        const osc2 = AudioSys.ctx.createOscillator(); const gain2 = AudioSys.ctx.createGain();
                        osc2.type = 'triangle'; osc2.frequency.value = freq;
                        gain2.gain.setValueAtTime(0.3, AudioSys.ctx.currentTime); gain2.gain.exponentialRampToValueAtTime(0.01, AudioSys.ctx.currentTime + 0.4);
                        osc2.connect(gain2).connect(AudioSys.ctx.destination); osc2.start(); osc2.stop(AudioSys.ctx.currentTime + 0.4);
                    }, i * 40);
                });
            },
            playLevelUpRoyal: () => {
                AudioSys.init(); const now = AudioSys.ctx.currentTime;
                [261.63, 329.63, 392.00].forEach(freq => {
                    const osc = AudioSys.ctx.createOscillator(); const gain = AudioSys.ctx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq / 2, AudioSys.ctx.currentTime); 
                    gain.gain.setValueAtTime(0, AudioSys.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.2, AudioSys.ctx.currentTime + 0.5); gain.gain.exponentialRampToValueAtTime(0.01, AudioSys.ctx.currentTime + 2.5);
                    osc.connect(gain).connect(AudioSys.ctx.destination); osc.start(); osc.stop(AudioSys.ctx.currentTime + 2.5);
                });
                [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
                    setTimeout(() => {

                document.getElementById('prog-badge-main').innerHTML = SVGBadge(rank, 200); 
                document.getElementById('prog-rank').innerText = rank.name;
                document.getElementById('prog-rank').style.color = rank.cMain;
                document.getElementById('prog-xp').innerText = state.xp.toLocaleString();
                document.getElementById('prog-next').innerText = nextRank.req.toLocaleString();
                
                let pct = nextRank.req > rank.req ? ((state.xp - rank.req) / (nextRank.req - rank.req)) * 100 : 100;
                document.getElementById('prog-bar').style.width = `${Math.min(100, Math.max(0, pct))}%`;

                const starsContainer = document.getElementById('prog-stars'); starsContainer.innerHTML = '';
                for(let i=1; i<=3; i++) {
                    let starClass = i <= rank.sub ? 'star-lit' : 'star-dim';
                    starsContainer.innerHTML += `<i class="ph-fill ph-star ${starClass}"></i>`;
                }

                const ladder = document.getElementById('ladder-container'); ladder.innerHTML = '';
                
                MajorRanksConfig.forEach((mr) => {
                    const unlockedSubs = Ranks.filter(r => r.major === mr.major && state.xp >= r.req).length;
                    const isCurrentMajor = rank.major === mr.major;
                    const isLocked = unlockedSubs === 0;

                    let cardBorder = isCurrentMajor ? `border-[var(--accent)] shadow-[0_0_15px_rgba(212,255,0,0.15)]` : `border-white/5`;
                    let opacity = isLocked ? 'opacity-50 grayscale' : 'opacity-100';
                    let nameColor = isLocked ? '#6B7280' : mr.cMain;

                    let cardStars = '';
                    for(let i=1; i<=3; i++) {
                        cardStars += `<i class="ph-fill ph-star ${i <= unlockedSubs ? 'text-[var(--accent)] drop-shadow-[0_0_5px_var(--accent)]' : 'text-[#2D3345]'} text-xs"></i>`;
                    }

                    const cardBadgeObj = Ranks.find(r => r.major === mr.major && r.sub === 1);

                    ladder.innerHTML += `
                        <div class="bg-[var(--card)] rounded-xl p-5 flex items-center justify-between border ${cardBorder} ${opacity} relative overflow-hidden transition-all duration-300">
                            <div class="absolute -left-6 top-0 bottom-0 w-2/3 bg-white/5 skew-x-[-20deg]"></div>
                            <div class="relative z-10 flex flex-col justify-center">
                                <h3 class="text-xl font-black mb-1 tracking-wide" style="color: ${nameColor};">${mr.major}</h3>
                                <div class="flex gap-1 mb-2">${cardStars}</div>
                                <div class="bg-black/30 px-3 py-1 rounded-md inline-block w-max border border-white/5">
                                    <span class="text-xs font-bold ${isLocked ? 'text-gray-500' : 'text-white'}">${mr.reqs[0].toLocaleString()} XP</span>
                                </div>
                            </div>
                            <div class="relative z-10 -my-2 mr-2">${SVGBadge(cardBadgeObj, 80, isLocked)}</div>
                        </div>`;
                });

                const gc = document.getElementById('goals-container'); gc.innerHTML = '';
                state.goals.forEach(g => {
                    gc.innerHTML += `
                        <div class="glass-card rounded-2xl p-5 flex items-center justify-between border ${g.done ? 'border-[var(--accent)] bg-[var(--accent)]/5' : 'border-[#232838]'}">
                            <div class="flex items-center gap-4 flex-1" onclick="App.toggleGoal('${g.id}')">
                                <input type="checkbox" class="habit-checkbox w-6 h-6 border-[2px]" ${g.done ? 'checked' : ''} style="border-radius:6px;" onclick="event.stopPropagation(); App.toggleGoal('${g.id}')">
                                <span class="font-bold text-base ${g.done?'text-gray-500 line-through':'text-white'}">${g.text}</span>
                            </div>
                            <button onclick="UI.deleteGoal('${g.id}')" class="text-gray-600 hover:text-[#FF3B30]"><i class="ph-bold ph-trash text-lg"></i></button>
                        </div>`;
                });
            },
            generateItemHTML: (item, isDone, isPriority) => {
                const timeLabel = item.time ? `<span class="bg-[#232838] px-2 py-1 rounded text-[10px] mr-2 border border-white/5 text-gray-300">${item.time}</span>` : "";
                return `
                <div class="glass-card rounded-[24px] p-5 flex justify-between items-center transition-all ${isDone ? 'border-[var(--accent)]/30 bg-[var(--accent)]/5' : (isPriority ? 'border-[#FFD700]/40 shadow-[0_0_15px_rgba(255,215,0,0.05)]' : '')}">
                    <div class="flex items-center gap-4 flex-1" onclick="App.toggleItem('${item.id}', event)">
                        <input type="checkbox" class="habit-checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); App.toggleItem('${item.id}', event)">
                        <div>
                            <div class="text-base font-bold ${isDone ? 'text-gray-500 line-through' : 'text-white'} transition-colors">${item.text}</div>
                            <div class="text-[11px] font-black text-[var(--accent)] mt-1.5 flex items-center">${timeLabel} +${item.xpReward} XP</div>
                        </div>
                    </div>
                    <button onclick="UI.openModal('${item.id}')" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-white rounded-full hover:bg-[#232838] transition-colors"><i class="ph-bold ph-pencil-simple text-xl"></i></button>
                </div>`;
            },
            
            toggleDateInput: () => {
                const type = document.getElementById('item-type').value;
                const dateInput = document.getElementById('item-date');
                if (type === 'task') { dateInput.disabled = false; dateInput.classList.remove('opacity-50'); } 
                else { dateInput.disabled = true; dateInput.classList.add('opacity-50'); }
            },
            openModal: (id = null) => {
                document.getElementById('item-id').value = id || '';
                if (id) {
                    const item = state.items.find(i => i.id === id);
                    document.getElementById('item-text').value = item.text;
                    document.getElementById('item-type').value = item.type;
                    document.getElementById('item-date').value = item.date || App.getTodayReal();
                    document.getElementById('item-time').value = item.time || "";
                    document.getElementById('item-xp').value = item.xpReward;
                    document.getElementById('item-category').value = item.category;
                    document.getElementById('btn-delete').classList.remove('hidden');
                } else {
                    document.getElementById('item-text').value = '';
                    document.getElementById('item-type').value = 'habit';
                    document.getElementById('item-date').value = viewingDate;
                    document.getElementById('item-time').value = "";
                    document.getElementById('item-xp').value = '50';
                    document.getElementById('item-category').value = '';
                    document.getElementById('btn-delete').classList.add('hidden');
                }
                UI.toggleDateInput();
                
                const backdrop = document.getElementById('modal-backdrop'); const modal = document.getElementById('habit-modal');
                backdrop.classList.remove('hidden'); modal.classList.remove('hidden');
                void backdrop.offsetWidth; backdrop.classList.remove('opacity-0'); modal.classList.remove('translate-y-full');
            },
            closeModal: () => {
                const backdrop = document.getElementById('modal-backdrop'); const modal = document.getElementById('habit-modal');
                backdrop.classList.add('opacity-0'); modal.classList.add('translate-y-full');
                setTimeout(() => { backdrop.classList.add('hidden'); modal.classList.add('hidden'); }, 300);
            },

            showLevelUp: (rank) => {
                const screen = document.getElementById('level-up-screen');
                const content = document.getElementById('level-up-content');
                const banner = document.getElementById('lu-banner');
                
                document.getElementById('new-rank-icon').innerHTML = SVGBadge(rank, 250);
                document.getElementById('new-rank-name').innerText = rank.name;
                document.getElementById('new-rank-name').style.color = rank.cMain;
                
                const stars = document.getElementById('new-rank-stars'); stars.innerHTML = '';
                for(let i=1; i<=3; i++) {
                    stars.innerHTML += `<i class="ph-fill ph-star ${i <= rank.sub ? 'star-lit text-[var(--accent)]' : 'star-dim'}"></i>`;
                }

                screen.classList.remove('hidden'); screen.classList.add('flex');
                
                [banner, content].forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = null; });
                banner.classList.add('banner-drop-active'); content.classList.add('badge-reveal-active');
            },
            hideLevelUp: () => { 
                const screen = document.getElementById('level-up-screen'); screen.classList.add('hidden'); screen.classList.remove('flex'); 
                document.getElementById('lu-banner').classList.remove('banner-drop-active'); document.getElementById('level-up-content').classList.remove('badge-reveal-active');
            },
            addGoal: () => {
                const text = prompt("Enter new strategic goal:");
                if(text) { state.goals.push({id: Math.random().toString(), text, done: false}); localStorage.setItem('critiqueV15', JSON.stringify(state)); UI.render(); }
            },
            deleteGoal: (id) => { state.goals = state.goals.filter(g => g.id !== id); localStorage.setItem('critiqueV15', JSON.stringify(state)); UI.render(); },
            
            renderChart: () => {
                const ctx = document.getElementById('xpChart').getContext('2d');
                const labels = []; const data = [];
                for(let i=6; i>=0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i); const dStr = d.toLocaleDateString('en-CA');
                    labels.push(d.toLocaleDateString('en-US', {weekday:'short'})); data.push(state.xpHistory[dStr] || 0);
                }
                if(chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: labels, datasets: [{ label: 'XP', data: data, borderColor: '#D4FF00', backgroundColor: 'rgba(212, 255, 0, 0.1)', tension: 0.4, fill: true, pointBackgroundColor: '#D4FF00', pointBorderWidth: 2 }] },
                    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#8B949E' } } } }
                });
            }
        };

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
